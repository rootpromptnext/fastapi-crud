apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-crud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi-crud
  template:
    metadata:
      labels:
        app: fastapi-crud
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: fastapi-crud
          image: ghcr.io/rootpromptnext/fastapi-crud:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: UVICORN_PORT
              value: "8000"
            - name: UVICORN_HOST
              value: "0.0.0.0"
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-crud-service
  labels:
    app: fastapi-crud
spec:
  type: NodePort
  selector:
    app: fastapi-crud
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080
